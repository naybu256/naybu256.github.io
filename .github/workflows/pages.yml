name: Publish BLACKCURRENT
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blackcurrent-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Upload validated public website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .
      - name: Publish Git-triggered version
        id: deployment
        uses: actions/deploy-pages@v5.0.1
